     element overrides it for that element and everything inside it. */
  :root,

  .text-heading-md { font-family: var(--font-sans); font-size: var(--text-heading-md); line-height: 1.2; font-weight: 650; letter-spacing: -0.015em; text-wrap: balance; }

/* Styles for the standalone reading list page (docs/reading-list.html). build-reading-list.mjs inlines this file
   after the generated tokens, so everything here reads the design system's tokens and follows all three themes. */
@layer base {
  html {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 100%;
    color-scheme: light dark;
    scroll-padding-top: var(--space-6);
  }
  body {
    margin: 0;
    font-size: var(--text-body);
    line-height: 1.6;
  }
  :focus-visible {
    outline: var(--focus-width) solid var(--focus);
    outline-offset: var(--focus-offset);
  }
  a {
    color: var(--link);
    text-underline-offset: 0.2em;
  }
  h1, h2, h3, h4 {
    margin: 0;
    line-height: 1.2;
    text-wrap: balance;
  }
}

@layer page {
  .rl-skip {
    position: absolute;
    inset-inline-start: var(--space-4);
    inset-block-start: calc(-1 * var(--space-16));
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-md);
    background: var(--surface);
  }
  .rl-skip:focus {
    inset-block-start: var(--space-4);
  }

  .rl-header,
  .rl-main {
    max-width: var(--content-max);
    margin-inline: auto;
    padding-inline: var(--space-4);
  }
  @media (min-width: 48em) {
    .rl-header,
    .rl-main {
      padding-inline: var(--space-8);
    }
  }

  .rl-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--space-4) var(--space-8);
    padding-block: var(--space-12) var(--space-8);
  }
  .rl-header h1 {
    font-size: var(--text-display);
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .rl-header p {
    max-width: var(--measure);
    margin: var(--space-3) 0 0;
    color: var(--ink-muted);
    font-size: var(--text-body-lg);
  }

  /* Theme switch: a row of pill buttons, pressed state from aria-pressed */
  .rl-themes {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .rl-themes button {
    min-height: var(--target-min);
    padding: var(--space-1) var(--space-4);
    border: var(--border-thin) solid var(--border-strong);
    border-radius: var(--radius-full);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: var(--text-small);
    font-weight: 600;
    cursor: pointer;
  }
  .rl-themes button[aria-pressed="true"] {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }

  /* The standalone page's own checkboxes in the systems list. The Storybook page uses the Checkbox component. */
  .rl-check {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: var(--choice-row);
    cursor: pointer;
  }
  .rl-check input {
    flex: none;
    width: var(--choice);
    height: var(--choice);
    margin: 0;
    accent-color: var(--action);
    cursor: pointer;
  }
  .rl-check--all {
    font-weight: 600;
  }
  /* Systems line up under the "All systems" label text, as in CheckboxGroup */
  .rl-check:not(.rl-check--all) {
    padding-inline-start: calc(var(--choice) + var(--space-3));
  }

  /* Group by: radios drawn as connected segments, chosen one filled */
  .rl-segments {
    display: flex;
    border: var(--border-thin) solid var(--border-strong);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .rl-segments label {
    position: relative;
    display: grid;
  }
  .rl-segments label + label {
    border-inline-start: var(--border-thin) solid var(--border-strong);
  }
  .rl-segments input {
    position: absolute;
    inset: 0;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .rl-segments span {
    display: grid;
    place-items: center;
    min-height: calc(var(--control-md) - 2 * var(--border-thin));
    padding: 0 var(--space-4);
    font-size: var(--text-small);
    font-weight: 600;
  }
  .rl-segments input:checked + span {
    background: var(--ink);
    color: var(--bg);
  }
  .rl-segments input:focus-visible + span {
    outline: var(--focus-width) solid var(--focus);
    outline-offset: calc(-1 * var(--focus-width) - var(--focus-offset));
  }

}

/* The reading list's filters and results, shared by the Storybook page (ReadingList.tsx) and the standalone page
   (docs/reading-list.html, which inlines this file). Reads only tokens, so it follows all three themes. */
@layer page {
  /* Filters */
  .rl-filters {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-4);
    align-items: end;
    padding: var(--space-5);
    border: var(--border-thin) solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
  }
  @media (min-width: 48em) {
    .rl-filters {
      grid-template-columns: 2fr auto 1fr;
    }
  }
  .rl-field {
    display: grid;
    gap: var(--space-2);
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }
  /* A legend sits on its fieldset's border; floating it lines it up with the other labels */
  .rl-field > legend {
    float: inline-start;
    width: 100%;
    margin-block-end: var(--space-2);
  }
  .rl-field > legend + * {
    clear: both;
  }
  .rl-field > label,
  .rl-field > legend {
    padding: 0;
    font-size: var(--text-small);
    font-weight: 600;
  }
  .rl-field input[type="search"],
  .rl-field select {
    box-sizing: border-box;
    width: 100%;
    min-height: var(--control-md);
    padding: 0 var(--space-3);
    border: var(--border-thin) solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  /* Systems: a disclosure with a checkbox for each system, across the whole filter panel */
  .rl-systems {
    grid-column: 1 / -1;
  }
  .rl-systems > summary {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-height: var(--control-md);
    padding: 0 var(--space-3);
    border: var(--border-thin) solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--bg);
    cursor: pointer;
    list-style: none;
  }
  .rl-systems > summary::-webkit-details-marker {
    display: none;
  }
  /* A chevron that turns when the list is open */
  .rl-systems > summary::after {
    content: "";
    width: 0.5rem;
    height: 0.5rem;
    margin-inline-start: auto;
    border-inline-end: var(--border-thick) solid currentColor;
    border-block-end: var(--border-thick) solid currentColor;
    transform: translateY(-25%) rotate(45deg);
    transition: transform var(--duration-fast) var(--ease-out);
  }
  .rl-systems[open] > summary::after {
    transform: translateY(25%) rotate(-135deg);
  }
  .rl-systems__label {
    font-size: var(--text-small);
    font-weight: 600;
  }
  .rl-systems__value {
    color: var(--ink-muted);
  }
  .rl-systems__options {
    margin: var(--space-3) 0 0;
    padding: var(--space-4);
    border: var(--border-thin) solid var(--border);
    border-radius: var(--radius-md);
  }
  /* The systems in columns, with "All systems" on its own row above them. The standalone page's fieldset holds
     its checkboxes directly; in Storybook they're inside CheckboxGroup's options list. */
  fieldset.rl-systems__options,
  .rl-systems .checkbox-group__options {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
    column-gap: var(--space-6);
    justify-items: stretch;
  }
  /* CheckboxGroup sizes its list to its content; across the panel, the columns need the full width */
  .rl-systems .checkbox-group__options {
    justify-self: stretch;
  }
  .rl-check--all,
  .rl-systems .checkbox[data-parent] {
    grid-column: 1 / -1;
  }
  .rl-field input::placeholder {
    color: var(--ink-muted);
  }

  /* Storybook's docs styles reset links inside Unstyled, so set them here */
  .rl-results a {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 0.2em;
  }
  .rl-results :is(h2, h3, h4) {
    margin: 0;
    line-height: 1.2;
    text-wrap: balance;
  }
  .rl-count {
    margin: var(--space-4) 0 0;
    color: var(--ink-muted);
    font-size: var(--text-small);
  }

  /* Results */
  .rl-results {
    display: grid;
    gap: var(--space-16);
    padding-block: var(--space-8) var(--space-20);
  }
  .rl-results:focus {
    outline: none;
  }

/* Text for screen readers only, such as FieldError's "Error:" and Spinner's announcement. It's clipped to nothing
   where it sits but still read: display: none or visibility: hidden would hide it from screen readers too. It's out
   of the flow, so it takes no room or gap; the element it sits in sets position: relative to hold it. 0.0625rem is
   1px: a box of no size at all is skipped by some screen readers, and a long text left at its full width could
   widen the page. Internal: components put it on a part next to the part's own class. */
@layer components {
  .visually-hidden {
    position: absolute;
    inset-block-start: 0;
    inset-inline-start: 0;
    inline-size: 0.0625rem;
    block-size: 0.0625rem;
    padding: 0; /* a <legend> has its own, which would make it wider */
    border: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}

  const systemBoxes = [...form.querySelectorAll('input[name="system"]')];
  const allBox = document.getElementById("rl-systems-all");
  const systemsValue = document.getElementById("rl-systems-value");
  const topicSelect = document.getElementById("rl-topic");

  const systems = new Map(data.systems.map((s) => [s.id, s]));
  const topics = new Map(data.topics.map((t) => [t.id, t]));
  const topicsIn = (group) => data.topics.filter((t) => t.group === group.id);
  const systemTopics = data.groups.filter((g) => g.kind === "systems").flatMap(topicsIn);

  // Everything a search can match: the title, note, system, and topic names
  const haystack = new Map(
    data.links.map((link) => [
      link,
      [link.title, link.note, systems.get(link.system)?.name, ...link.topics.map((t) => topics.get(t).name)]
        .filter(Boolean)
        .join(" ")
        .toLowerCase(),
    ]),
  );

  const el = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "class") node.className = value;
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) if (child != null && child !== false) node.append(child);
    return node;
  };
  const linkItem = (link, showSystem) =>
    el(
      "li",
      { class: "rl-link" },
      el("a", { href: link.url }, link.title),
      showSystem && link.system ? el("span", { class: "rl-link__system" }, systems.get(link.system).name) : null,
      link.note ? el("p", { class: "rl-link__note" }, link.note) : null,
    );
  const card = (title, links, showSystem = false) =>
    el("div", { class: "rl-card" }, title ? el("h4", {}, title) : null, el("ul", {}, links.map((l) => linkItem(l, showSystem))));

  function render() {
    const words = query.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const chosen = systemBoxes.filter((box) => box.checked).map((box) => box.value);
    const allChosen = chosen.length === systemBoxes.length;
    // "All systems" is ticked, unticked, or mixed, like any select-all box
    allBox.checked = allChosen;
    allBox.indeterminate = chosen.length > 0 && !allChosen;
    systemsValue.textContent = allChosen
      ? "All"
      : chosen.length === 1
        ? systems.get(chosen[0]).name
        : `${chosen.length} of ${systemBoxes.length}`;
    const topic = topicSelect.value;
    const view = form.elements.view.value;
    const shown = data.links.filter(
      (link) =>
        (allChosen || chosen.includes(link.system)) &&
        (!topic || link.topics.includes(topic)) &&
        words.every((word) => haystack.get(link).includes(word)),
    );
    const has = (filter) => shown.filter(filter);
    // A link can cover several topics; with a topic chosen, show only that one
    const shownTopic = (t) => !topic || t.id === topic;
    const sections = [];

    if (view === "topic") {
      for (const group of data.groups) {
        const blocks = [];
        for (const t of topicsIn(group).filter(shownTopic)) {
          const links = has((l) => l.topics.includes(t.id));
          if (!links.length) continue;
          const body =
            group.kind === "reading"
              ? [card(null, links)]
              : data.systems
                  .map((s) => [s, links.filter((l) => l.system === s.id)])
                  .filter(([, ls]) => ls.length)
                  .map(([s, ls]) => card(s.name, ls));
          blocks.push(el("section", { class: "rl-topic" }, el("h3", {}, t.name), t.intro ? el("p", { class: "rl-intro" }, t.intro) : null, el("div", { class: "rl-cards" }, body)));
        }
        if (blocks.length) sections.push(el("section", { class: "rl-group" }, el("h2", {}, group.name), group.intro ? el("p", { class: "rl-intro" }, group.intro) : null, blocks));
      }
    } else {
      for (const s of data.systems) {
        const links = has((l) => l.system === s.id);
        if (!links.length) continue;
        const cards = systemTopics
          .filter(shownTopic)
          .map((t) => [t, links.filter((l) => l.topics.includes(t.id))])
          .filter(([, ls]) => ls.length)
          .map(([t, ls]) => card(t.name, ls));
        sections.push(
          el("section", { class: "rl-group" }, el("h2", {}, el("a", { href: s.url }, s.name)), el("div", { class: "rl-cards" }, cards)),
        );
      }
      const other = has((l) => !l.system);
      if (other.length) {
        const cards = data.topics
          .filter(shownTopic)
          .map((t) => [t, other.filter((l) => l.topics.includes(t.id))])
          .filter(([, ls]) => ls.length)
          .map(([t, ls]) => card(t.name, ls));
        sections.push(el("section", { class: "rl-group" }, el("h2", {}, "Articles and standards"), el("div", { class: "rl-cards" }, cards)));
      }
    }

    results.replaceChildren(...sections);
    if (!sections.length) results.append(el("p", { class: "rl-empty" }, chosen.length ? "No links match. Try fewer words, or set Systems and Topic back to all." : "Tick at least one system to see its links."));
    count.textContent =
      shown.length === data.links.length ? `Showing all ${data.links.length} links.` : `Showing ${shown.length} of ${data.links.length} links.`;
  }

  form.addEventListener("input", (event) => {
    // Ticking "All systems" ticks or unticks every system before the list redraws
    if (event.target === allBox) for (const box of systemBoxes) box.checked = allBox.checked;
    render();
  });
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    results.focus();
  });

  // Themes: Auto follows the system setting; the others set data-theme on <html>
  const themeButtons = document.querySelectorAll("[data-theme-choice]");
  for (const button of themeButtons) {
    button.addEventListener("click", () => {
      const choice = button.dataset.themeChoice;
      if (choice === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.dataset.theme = choice;
      for (const b of themeButtons) b.setAttribute("aria-pressed", String(b === button));
    });
  }

  render();
})();
</script>
</body>
</html>
