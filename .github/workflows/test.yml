# Typechecks, builds, and runs every test: Testing Library unit tests (jsdom) and
# Storybook stories, including axe checks, in real Chromium.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - name: Install Chromium for the story tests
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test
