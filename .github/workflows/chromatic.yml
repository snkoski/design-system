# Publishes Storybook to Chromatic and runs visual tests on every push to main. Only on main, and only the stories
# a change affects (--only-changed, Chromatic's TurboSnap), to keep within the free plan's snapshots.
# Needs one repository secret: CHROMATIC_PROJECT_TOKEN (from chromatic.com → your project → Manage → Configure).
#
# PAUSED since 2026-10-27: switched off on GitHub with `gh workflow disable Chromatic` while the components are
# being built. Turn it back on with `gh workflow enable Chromatic` (see "Visual tests are paused" in README.md).
name: Chromatic

on:
  push:
    branches: [main]

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Chromatic needs git history to compare builds

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        run: pnpm chromatic --project-token="${{ secrets.CHROMATIC_PROJECT_TOKEN }}" --only-changed
